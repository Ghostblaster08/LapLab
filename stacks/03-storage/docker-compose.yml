networks:
  homelab-net:
    external: true

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_server
    volumes:
      - ${STORAGE_PATH}/photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - REDIS_HOSTNAME=immich-redis
      - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    ports:
      - "2283:2283"
    depends_on:
      immich-redis:
        condition: service_started
      immich-postgres:
        condition: service_healthy   # wait for postgres to be actually ready
      immich-machine-learning:
        condition: service_started
    restart: unless-stopped
    networks:
      - homelab-net

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich_machine_learning
    volumes:
      - ${APPDATA_PATH}/immich/model-cache:/cache
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500M
    networks:
      - homelab-net

  immich-redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: immich_redis
    volumes:
      - ${APPDATA_PATH}/immich/redis:/data   # persist cache across restarts
    restart: unless-stopped
    networks:
      - homelab-net

  immich-postgres:
    image: pgvector/pgvector:pg16
    container_name: immich_postgres
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_DATABASE_NAME}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ${APPDATA_PATH}/immich/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - homelab-net
    # Healthcheck so immich-server waits for postgres to be ready before connecting
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_DATABASE_NAME} -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "${PUID}:${PGID}"
    ports:
      - "8085:80"
    volumes:
      - ${STORAGE_PATH}:/srv
      - ${APPDATA_PATH}/filebrowser/database:/database
      - ${APPDATA_PATH}/filebrowser/config:/config
    restart: unless-stopped
    networks:
      - homelab-net

