networks:
  homelab-net:
    external: true

services:
  # Home Assistant in 'container' mode (not supervised/OS).
  # 'network_mode: host' is REQUIRED — HA needs direct LAN access to discover
  # mDNS devices (Chromecast, Sonos, HomeKit, Matter/Thread, DLNA, etc.).
  # A Docker bridge cannot see mDNS multicast traffic.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    network_mode: host   # IMPORTANT: must be host, not bridge — see above comment
    volumes:
      - ${APPDATA_PATH}/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro   # Bluetooth device discovery

  # Eclipse Mosquitto: the MQTT message broker.
  # Smart plugs, sensors, ESPs, Zigbee2MQTT all publish here.
  # HA subscribes to topics via the MQTT integration.
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"    # MQTT (plaintext — LAN only)
      - "8883:8883"    # MQTT over TLS (for external/WAN clients)
      - "9001:9001"    # MQTT over WebSockets (for browser clients)
    volumes:
      - ${APPDATA_PATH}/mosquitto/config:/mosquitto/config
      - ${APPDATA_PATH}/mosquitto/data:/mosquitto/data
      - ${APPDATA_PATH}/mosquitto/log:/mosquitto/log
    networks:
      - homelab-net
