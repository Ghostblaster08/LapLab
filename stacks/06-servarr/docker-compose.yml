networks:
  homelab-net:
    external: true

# ============================================================
# IMPORTANT: Gluetun MUST start before all other services.
# qBittorrent, Sonarr, Radarr, Prowlarr, Bazarr all route
# their traffic through Gluetun's network namespace using
# network_mode: "service:gluetun". This means:
#   - They share Gluetun's IP and network interfaces
#   - Their ports are published on Gluetun, NOT on themselves
#   - If Gluetun dies, ALL their internet traffic is killed
# ============================================================

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN   # required to create the WireGuard/OpenVPN tun interface
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Ports published here serve ALL services using network_mode: service:gluetun
      - "8082:8082"    # qBittorrent Web UI
      - "6881:6881"    # qBittorrent listening port (TCP)
      - "6881:6881/udp"
      - "9117:9117"    # Jackett (alternative indexer, if used)
    volumes:
      - ${APPDATA_PATH}/gluetun:/gluetun
    environment:
      # Adjust VPN_SERVICE_PROVIDER and credentials for your VPN (Mullvad / ProtonVPN / etc.)
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_WG_PRIVATE_KEY}   # add to .env
      - WIREGUARD_ADDRESSES=${GLUETUN_WG_ADDRESS}          # add to .env
      - SERVER_COUNTRIES=Netherlands
    restart: unless-stopped
    networks:
      - homelab-net

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"   # ALL traffic goes through Gluetun VPN tunnel
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8082
    volumes:
      - ${APPDATA_PATH}/qbittorrent/config:/config
      - ${STORAGE_PATH}/downloads:/downloads
    depends_on:
      - gluetun
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_PATH}/prowlarr/config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - homelab-net

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_PATH}/radarr/config:/config
      - ${STORAGE_PATH}/media/movies:/movies
      - ${STORAGE_PATH}/downloads:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - homelab-net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_PATH}/sonarr/config:/config
      - ${STORAGE_PATH}/media/tv:/tv
      - ${STORAGE_PATH}/downloads:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - homelab-net

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_PATH}/bazarr/config:/config
      - ${STORAGE_PATH}/media/movies:/movies
      - ${STORAGE_PATH}/media/tv:/tv
    ports:
      - "6767:6767"
    restart: unless-stopped
    networks:
      - homelab-net
